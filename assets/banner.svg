<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Git e GitHub do Zero</title>
  <desc id="descricao">Curso prático em português. Um histórico de commits desenha-se: a linha principal avança, nasce uma branch e volta a juntar-se com um merge.</desc>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1c2738"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; }
    .linha { fill: none; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0; }
    .ponto { transform-box: fill-box; transform-origin: center; stroke: #0d1117; stroke-width: 5; }

    .grafo { animation: ciclo 12s linear infinite; }
    .principal { animation: principal 12s linear infinite; }
    .ramo { animation: ramo 12s linear infinite; }
    .p1 { animation: p1 12s ease-out infinite; }
    .p2 { animation: p2 12s ease-out infinite; }
    .p3 { animation: p3 12s ease-out infinite; }
    .p4 { animation: p4 12s ease-out infinite; }
    .p5 { animation: p5 12s ease-out infinite; }
    .p6 { animation: p6 12s ease-out infinite; }
    .p7 { animation: p7 12s ease-out infinite; }
    .etiqueta-ramo { animation: etiquetaRamo 12s linear infinite; }
    .etiqueta-merge { animation: etiquetaMerge 12s linear infinite; }
    .cursor { animation: piscar 1.1s steps(1) infinite; }

    @keyframes ciclo { 0%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes principal { 0%, 2% { stroke-dashoffset: 1; } 40%, 100% { stroke-dashoffset: 0; } }
    @keyframes ramo { 0%, 17% { stroke-dashoffset: 1; } 31%, 100% { stroke-dashoffset: 0; } }
    @keyframes p1 { 0%, 3% { opacity: 0; transform: scale(0); } 6% { opacity: 1; transform: scale(1.3); } 8%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes p2 { 0%, 10% { opacity: 0; transform: scale(0); } 13% { opacity: 1; transform: scale(1.3); } 15%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes p3 { 0%, 16% { opacity: 0; transform: scale(0); } 19% { opacity: 1; transform: scale(1.3); } 21%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes p4 { 0%, 21% { opacity: 0; transform: scale(0); } 24% { opacity: 1; transform: scale(1.3); } 26%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes p5 { 0%, 26% { opacity: 0; transform: scale(0); } 29% { opacity: 1; transform: scale(1.3); } 31%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes p6 { 0%, 32% { opacity: 0; transform: scale(0); } 35% { opacity: 1; transform: scale(1.3); } 37%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes p7 { 0%, 38% { opacity: 0; transform: scale(0); } 41% { opacity: 1; transform: scale(1.3); } 43%, 100% { opacity: 1; transform: scale(1); } }
    @keyframes etiquetaRamo { 0%, 19% { opacity: 0; } 23%, 100% { opacity: 1; } }
    @keyframes etiquetaMerge { 0%, 35% { opacity: 0; } 39%, 100% { opacity: 1; } }
    @keyframes piscar { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="1200" height="380" rx="24" fill="url(#fundo)"/>

  <text class="mono" x="80" y="72" font-size="22" fill="#3fb950">$ git init curso<tspan class="cursor" fill="#e6edf3"> ▍</tspan></text>

  <text x="78" y="148" font-size="68" font-weight="700" fill="#ffffff">Git e GitHub <tspan fill="#3fb950">do Zero</tspan></text>
  <text x="80" y="194" font-size="26" fill="#9da7b3">Do primeiro commit ao primeiro pull request. Em português, sem saltar passos.</text>

  <g class="grafo">
    <path class="linha principal" pathLength="1" stroke="#58a6ff" d="M120 310 H1080"/>
    <path class="linha ramo" pathLength="1" stroke="#a371f7" d="M480 310 C540 310 540 250 600 250 H760 C820 250 820 310 880 310"/>

    <circle class="ponto p1" cx="160" cy="310" r="15" fill="#58a6ff"/>
    <circle class="ponto p2" cx="320" cy="310" r="15" fill="#58a6ff"/>
    <circle class="ponto p3" cx="480" cy="310" r="15" fill="#58a6ff"/>
    <circle class="ponto p4" cx="630" cy="250" r="15" fill="#a371f7"/>
    <circle class="ponto p5" cx="740" cy="250" r="15" fill="#a371f7"/>
    <circle class="ponto p6" cx="880" cy="310" r="15" fill="#3fb950"/>
    <circle class="ponto p7" cx="1040" cy="310" r="15" fill="#58a6ff"/>

    <g class="etiqueta-ramo">
      <rect x="622" y="204" width="126" height="26" rx="13" fill="#a371f7" fill-opacity="0.18" stroke="#a371f7"/>
      <text class="mono" x="685" y="222" font-size="15" fill="#d2b8ff" text-anchor="middle">nova-ideia</text>
    </g>
    <g class="etiqueta-merge">
      <text class="mono" x="880" y="350" font-size="15" fill="#3fb950" text-anchor="middle">merge</text>
    </g>
    <rect x="96" y="334" width="62" height="26" rx="13" fill="#58a6ff" fill-opacity="0.18" stroke="#58a6ff"/>
    <text class="mono" x="127" y="352" font-size="15" fill="#a5d0ff" text-anchor="middle">main</text>
  </g>
</svg>
