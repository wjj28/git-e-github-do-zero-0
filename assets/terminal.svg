<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Guardar e publicar trabalho com três comandos</title>
  <desc id="descricao">Um terminal onde aparecem, um a um, os comandos git add, git commit e git push, com a resposta do Git a cada um.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace; font-size: 19px; }
    .titulo { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; }
    .cmd { fill: #e6edf3; }
    .seta { fill: #3fb950; }
    .saida { fill: #8b949e; }
    .fim { fill: #3fb950; font-weight: 700; }

    .ecra { animation: ecra 14s linear infinite; }
    .l1 { animation: l1 14s linear infinite; }
    .l2 { animation: l2 14s linear infinite; }
    .l3 { animation: l3 14s linear infinite; }
    .l4 { animation: l4 14s linear infinite; }
    .l5 { animation: l5 14s linear infinite; }
    .l6 { animation: l6 14s linear infinite; }
    .cursor { animation: piscar 1.1s steps(1) infinite; }

    @keyframes ecra { 0%, 93% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes l1 { 0%, 4% { opacity: 0; } 6%, 100% { opacity: 1; } }
    @keyframes l2 { 0%, 16% { opacity: 0; } 18%, 100% { opacity: 1; } }
    @keyframes l3 { 0%, 24% { opacity: 0; } 26%, 100% { opacity: 1; } }
    @keyframes l4 { 0%, 40% { opacity: 0; } 42%, 100% { opacity: 1; } }
    @keyframes l5 { 0%, 48% { opacity: 0; } 50%, 100% { opacity: 1; } }
    @keyframes l6 { 0%, 60% { opacity: 0; } 63%, 100% { opacity: 1; } }
    @keyframes piscar { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="900" height="400" rx="16" fill="#0d1117"/>
  <rect width="900" height="400" rx="16" fill="none" stroke="#30363d" stroke-width="2"/>
  <path d="M0 16 A16 16 0 0 1 16 0 H884 A16 16 0 0 1 900 16 V44 H0 Z" fill="#161b22"/>
  <circle cx="28" cy="22" r="7" fill="#ff5f57"/>
  <circle cx="52" cy="22" r="7" fill="#febc2e"/>
  <circle cx="76" cy="22" r="7" fill="#28c840"/>
  <text class="titulo" x="450" y="27" fill="#8b949e" text-anchor="middle">Git Bash · meu-projeto</text>

  <g class="ecra">
    <g class="l1">
      <text x="32" y="90"><tspan class="seta">$ </tspan><tspan class="cmd">git add relatorio.py</tspan></text>
    </g>
    <g class="l2">
      <text x="32" y="130"><tspan class="seta">$ </tspan><tspan class="cmd">git commit -m "Adiciona relatório semanal"</tspan></text>
    </g>
    <g class="l3">
      <text class="saida" x="32" y="162">[main 3f2a9c1] Adiciona relatório semanal</text>
      <text class="saida" x="44" y="190">1 file changed, 24 insertions(+)</text>
    </g>
    <g class="l4">
      <text x="32" y="232"><tspan class="seta">$ </tspan><tspan class="cmd">git push</tspan></text>
    </g>
    <g class="l5">
      <text class="saida" x="32" y="264">To github.com:tu/meu-projeto.git</text>
      <text class="saida" x="56" y="292">a1b2c3d..3f2a9c1  main -&gt; main</text>
    </g>
    <g class="l6">
      <text class="fim" x="32" y="344">✓ Guardado no histórico e publicado no GitHub</text>
    </g>
  </g>
  <text class="cursor" x="32" y="376" fill="#e6edf3">▍</text>
</svg>
